<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <!-- Se referencia con el archivo CSS-->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!--Contenedor principal para el formulario-->
    <div class="contenedor-formulario">

        <!--título que diga "Registro de la persona Usuaria-->
        <h1>Registro de la persona Usuaria</h1>

           <!--El atributo action determina que se enviaran datos del formulario cuando de entregue-->
            <!--POST Se usa para enviar datos a un servidor y crear un recurso-->
        <form id="form-registro" action="#" method="POST">
         
            <!--Campos de texto para el formulario-->
            <!--Campo Nombre-->
            <!-- El atributo 'for' del label debe coincidir con el 'id' del input para vincularlos -->
             <!-- El atributo 'required' hace que el campo sea obligatorio antes de enviar -->
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>

            <!--Campo Apellido-->
            <label for="lastname">Apellido:</label>
            <input type="text" id="lastname" name="lastname" required>

            <!--Campo Correo Electrónico-->
            <!-- type="email" valida automáticamente que el texto tenga formato de correo -->
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <!-- Campo Contraseña-->
            <!-- type="password" oculta los caracteres con puntos o asteriscos por seguridad -->
             <label for="password">Contraseña:</label>
             <input type="password" id="password" name="password" required>

            <!--Área de texto para introducir breve descripcion sobre sí mismo-->
            <!-- Se usa textarea en lugar de input para permitir múltiples líneas de texto. 'rows' define la altura -->
            <label for="brief">Breve descripcion sobre ti:</label>
            <textarea id="brief" name="brief" rows="5" cols="30" placeholder="Escribe aqui..">
            </textarea>    

            <!--Conjunto de opciones (checkboxes) para indicar intereses-->
            <!-- fieldset agrupa elementos relacionados y legend le da un título al grupo -->
            <fieldset>
                <legend>Selecciona tus intereses:</legend>

            <!-- type="checkbox" permite seleccionar múltiples opciones a la vez -->
            <div>
                <input type="checkbox" id="tech" name="tech"/>
                <label for="tech">Tecnología</label>
            </div>

            <div>
                <input type="checkbox" id="art" name="art"/>
                <label for="art">Arte</label>
            </div>

            <div>
                <input type="checkbox" id="sport" name="sport"/>
                <label for="sport">Deporte</label>
            </div>

            <div>
                <input type="checkbox" id="eco" name="eco"/>
                <label for="eco">Economía</label>
            </div>

            <div>
                <input type="checkbox" id="med" name="med"/>
                <label for="med">Medicina</label>
            </div>
            </fieldset>
            
            <!--Botón de envío (submit) con el texto "Registrarse-->
            <!-- type="submit" activa el envío de todo el formulario -->
            <input type="submit" value="Registrarse" class="boton-enviar" />

        </form>


    </div>
</body>
</html>
